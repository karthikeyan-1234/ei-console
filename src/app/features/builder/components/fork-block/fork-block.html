<div
  class="branch-container"
  [class.dragging]="isDragging()"
  [attr.data-fork-start]="block().startIdx"
  [attr.data-fork-end]="block().endIdx">

  <div class="branch-header">
    <span
      class="fork-drag-handle"
      draggable="true"
      title="Drag to move the whole fork"
      (dragstart)="onDragStart($event)"
      (dragend)="onDragEnd()">⠿</span>
    <span class="bh-icon">⑂</span>
    <span>PARALLEL FORK</span>
    <span class="bh-count">{{ laneCountLabel() }}</span>

    <div class="bh-actions">
      <button (click)="onAddLane()">+ Add lane</button>
      <button
        style="color:#b91c1c"
        (click)="onRemoveFork()">Remove fork</button>
    </div>
  </div>

  <div class="lanes" [style.grid-template-columns]="lanesGridStyle()">
    @for (b of branches(); track b.idx) {
      <ei-branch-lane
        [branch]="b.branch"
        [idx]="b.idx"
        [jobId]="jobId()"
        (childDropped)="onLaneChildDropped($event)" />
    }
  </div>
</div>
