<div
  class="pipeline-tree"
  #pipelineTree>
  <div class="pipeline-toplevel">

    @for (block of blocks(); track block.startIdx; let i = $index; let isLast = $last) {

      <div
        class="drop-slot"
        [class.drop-active]="dropTargetsVisible()"
        (dragover)="onSlotDragOver($event)"
        (drop)="onSlotDrop($event, i)"></div>

      @if (block.type === 'node' && block.task) {
        <ei-pipeline-node
          [task]="block.task"
          dragKind="top"
          [dragTopIdx]="block.startIdx"
          [jobId]="job().id"
          [nodePath]="{ level: 'top', topIdx: block.startIdx }" />
      } @else if (block.type === 'fork') {
        <ei-fork-block
          [block]="block"
          [jobId]="job().id"
          (childDropped)="onChildDrop($event)" />
      }

      @if (!isLast) {
        <div
          class="pipeline-arrow clickable"
          [class.selected]="arrowIdx() === i"
          [attr.data-arrow-after-block]="i"
          title="Click to select this connector — + Add task inserts here"
          (click)="onArrowClick(i)"></div>
      }
    }

    <div
      class="drop-slot"
      [class.drop-active]="dropTargetsVisible()"
      (dragover)="onSlotDragOver($event)"
      (drop)="onSlotDrop($event, lastSlotIdx())"></div>
  </div>
</div>
