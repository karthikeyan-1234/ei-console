<div class="callout" style="background:#eff6ff;border-color:#60a5fa">
  <b>⊧ Await (JoinPoint)</b> — barrier that awaits the preceding sibling branches.
  Only one await per group of consecutive branches.
</div>

<div class="form-grid">

  <div class="form-group">
    <label>Await mode</label>
    <select (change)="onModeChange($any($event.target).value)">
      @for (m of modes; track m.value) {
        <option [value]="m.value" [selected]="m.value === mode()">{{ m.label }}</option>
      }
    </select>
  </div>

  @if (isWaitN()) {
    <div class="form-group">
      <label>Threshold (WaitN)</label>
      <input
        type="number"
        min="1"
        [value]="threshold()"
        (input)="onThresholdChange($any($event.target).value)" />
    </div>
  }

  <div class="form-group">
    <label>Timeout (seconds)</label>
    <input
      type="number"
      min="1"
      [value]="timeoutSeconds()"
      (input)="onTimeoutSecondsChange($any($event.target).value)" />
  </div>

  <div class="form-group">
    <label>On timeout</label>
    <select (change)="onTimeoutActionChange($any($event.target).value)">
      @for (a of timeoutActions; track a.value) {
        <option [value]="a.value" [selected]="a.value === timeoutAction()">{{ a.label }}</option>
      }
    </select>
  </div>
</div>
