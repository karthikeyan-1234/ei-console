<div class="callout">
  <b>API Pull</b> — fetches data from a provider. The <b>sample response</b> below is the
  source JSON that feeds all downstream tasks. Edit it to see the flow update across the pipeline.
</div>

<div class="form-grid">
  <div class="form-group">
    <label>Connection</label>
    <select (change)="onConnectionChange($any($event.target).value)">
      <option value="" [selected]="!task().connectionId">— Select —</option>
      @for (c of connectionOptions(); track c.id) {
        <option [value]="c.id" [selected]="c.id === task().connectionId">{{ c.name }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label>Auth Profile</label>
    <select (change)="onAuthChange($any($event.target).value)">
      <option value="" [selected]="!task().authId">— Connection default —</option>
      @for (a of authOptions(); track a.id) {
        <option [value]="a.id" [selected]="a.id === task().authId">{{ a.name }}</option>
      }
    </select>
  </div>

  <div class="form-group full">
    <label>Endpoint URL / Path</label>
    <input
      type="text"
      style="font-family:var(--mono)"
      [value]="task().url || ''"
      (input)="onUrlChange($any($event.target).value)" />
  </div>

  <div class="form-group">
    <label>HTTP Method</label>
    <select (change)="onMethodChange($any($event.target).value)">
      @for (m of methods; track m) {
        <option [value]="m" [selected]="m === (task().method || 'GET')">{{ m }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label>Timeout (s)</label>
    <input
      type="number"
      [value]="task().timeout || 30"
      (input)="onTimeoutChange($any($event.target).value)" />
  </div>

  <div class="form-group full">
    <label>Store output as key</label>
    <input
      type="text"
      style="font-family:var(--mono)"
      [value]="task().outputKey || 'Source'"
      (input)="onOutputKeyChange($any($event.target).value)" />
  </div>

  <div class="form-group full">
    <label>
      Sample response JSON
      <span class="hint" style="text-transform:none;font-weight:500">
        — the source that feeds the whole pipeline
      </span>
    </label>
    <textarea
      class="editor-pane"
      rows="8"
      style="margin-top:4px"
      [value]="task().sampleResponse || ''"
      (input)="onSampleResponseChange($any($event.target).value)"></textarea>
  </div>
</div>
