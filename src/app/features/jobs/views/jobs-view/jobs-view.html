<div class="cv-head">
  <div>
    <h3>All Jobs</h3>
    <div class="sub">{{ subtitle() }}</div>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" (click)="onRefresh()">Refresh</button>
    <button class="btn" (click)="onCreate()">+ Create Job</button>
  </div>
</div>

<ei-jobs-toolbar
  [(search)]="searchQuery"
  [(status)]="statusFilter" />

<ei-jobs-table
  [rows]="filteredJobs()"
  (jobOpened)="onOpenJob($event)"
  (jobEdited)="onEditJob($event)"
  (jobRemoved)="onRemoveJob($event)" />

@if (modalOpen()) {
  <ei-create-job-modal
    [editing]="modalEditing()"
    (saved)="onModalSaved($event)"
    (cancelled)="onModalCancelled()" />
}
