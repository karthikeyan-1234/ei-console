<div class="ccard">
  <div class="cc-head">
    <div class="cc-title">{{ icon() }} {{ profile().name }}</div>
    <span class="tenant-badge">{{ tenantLabel() }}</span>
  </div>

  <div class="cc-meta">
    <div><b>Type:</b> {{ typeLabel() }}</div>

    @if (profile().realm && profile().realm !== '—') {
      <div><b>Realm:</b> {{ profile().realm }}</div>
    }

    @if (profile().audience && profile().audience !== '—') {
      <div><b>Audience:</b> {{ profile().audience }}</div>
    }
  </div>

  <div class="cc-actions">
    <button class="btn btn-outline btn-sm" (click)="onEdit()">Edit</button>
    <button class="btn btn-outline btn-sm" (click)="onTest()">Test</button>
    <button class="btn-ghost btn btn-sm" style="color:var(--red)" (click)="onDelete()">Delete</button>
  </div>
</div>
