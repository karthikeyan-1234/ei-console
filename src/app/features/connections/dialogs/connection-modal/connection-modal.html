<ei-modal-shell
  [title]="title()"
  [subtitle]="subtitle()"
  (closed)="onCancel()">

  @if (error()) {
    <div class="callout danger" style="margin-top:0">{{ error() }}</div>
  }

  <div class="form-grid">

    <div class="form-group full">
      <label>Connection Name</label>
      <input
        type="text"
        [value]="name()"
        (input)="onNameInput($any($event.target).value)" />
    </div>

    <div class="form-group">
      <label>Provider</label>
      <input
        type="text"
        [value]="provider()"
        (input)="onProviderInput($any($event.target).value)" />
    </div>

    <div class="form-group">
      <label>Protocol</label>
      <select (change)="onProtocolInput($any($event.target).value)">
        <option value="Rest"      [selected]="protocol() === 'Rest'">Rest</option>
        <option value="Soap"      [selected]="protocol() === 'Soap'">Soap</option>
        <option value="Json"      [selected]="protocol() === 'Json'">Json</option>
        <option value="SqlServer" [selected]="protocol() === 'SqlServer'">SQL Server</option>
        <option value="Ftp"       [selected]="protocol() === 'Ftp'">FTP</option>
        <option value="Sftp"      [selected]="protocol() === 'Sftp'">SFTP</option>
      </select>
    </div>

    <div class="form-group full">
      <label>{{ baseUrlLabel() }}</label>
      <input
        type="text"
        style="font-family:var(--mono)"
        [value]="baseUrl()"
        (input)="onBaseUrlInput($any($event.target).value)" />
      @if (baseUrlHint()) {
        <div class="hint">{{ baseUrlHint() }}</div>
      }
    </div>

    @if (isFileTransfer()) {
      <div class="form-group">
        <label>Port</label>
        <input
          type="number"
          min="1"
          max="65535"
          [value]="port() ?? defaultPortFor() ?? ''"
          (input)="onPortInput($any($event.target).value)" />
        <div class="hint">
          Default: <code>{{ defaultPortFor() }}</code>
        </div>
      </div>
    }

    <div class="form-group">
      <label>Tenant Scope</label>
      <select (change)="onTenantInput($any($event.target).value)">
        @for (t of tenantOptions(); track t.id) {
          <option [value]="t.id" [selected]="t.id === tenant()">{{ t.label }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Default Auth Profile</label>
      <select (change)="onAuthInput($any($event.target).value)">
        <option value="" [selected]="authProfile() === ''">— None —</option>
        @for (a of authOptions(); track a.id) {
          <option [value]="a.id" [selected]="a.id === authProfile()">{{ a.name }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>{{ timeoutLabel() }}</label>
      <input
        type="number"
        [value]="timeout()"
        (input)="onTimeoutInput($any($event.target).value)" />
    </div>

    @if (isHttpProtocol()) {
      <div class="form-group full">
        <label>Default Headers (JSON)</label>
        <textarea
          rows="2"
          style="font-family:var(--mono)"
          [value]="headers()"
          (input)="onHeadersInput($any($event.target).value)"></textarea>
      </div>
    }
  </div>

  <button modalFooter class="btn-outline btn" (click)="onCancel()">Cancel</button>
  <button modalFooter class="btn" (click)="onSave()">Save Connection</button>
</ei-modal-shell>
