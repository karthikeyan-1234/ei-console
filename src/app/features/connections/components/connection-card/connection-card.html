<div class="ccard">
  <div class="cc-head">
    <div class="cc-title">🔌 {{ connection().name }}</div>
    @if (isShared()) {
      <span class="shared-badge">Shared</span>
    }
  </div>

  <div class="cc-meta">
    <div><b>Provider:</b> {{ connection().provider }}</div>
    <div><b>Protocol:</b> {{ connection().protocol }}</div>
    <div>
      <b>URL:</b>
      <code style="font-family:var(--mono);font-size:10.5px;background:#f1f5f9;padding:1px 4px;border-radius:3px">
        {{ connection().baseUrl }}
      </code>
    </div>
    <div><b>Auth:</b> {{ authName() }}</div>
    <div><b>Timeout:</b> {{ connection().timeout || 30000 }} ms</div>
  </div>

  <div class="cc-actions">
    <button class="btn btn-outline btn-sm" (click)="onEdit()">Edit</button>
    <button class="btn btn-outline btn-sm" (click)="onTest()">Test</button>
    <button class="btn-ghost btn btn-sm" style="color:var(--red)" (click)="onDelete()">Delete</button>
  </div>
</div>
