<button
  type="button"
  class="chat-bubble"
  [class.anim-blink]="animation() === 'blink'"
  [class.anim-bob]="animation() === 'bob'"
  [class.anim-wiggle]="animation() === 'wiggle'"
  [class.anim-peek]="animation() === 'peek'"
  [class.anim-pulse]="animation() === 'pulse'"
  [class.anim-wave]="animation() === 'wave'"
  (click)="onClick()"
  title="Open chat assistant"
  aria-label="Open chat assistant">

  @if (hasUnread()) {
    <span class="chat-bubble-unread" aria-hidden="true"></span>
  }

  <svg class="robot-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    <!-- Antenna — pivots at its base for the "peek" idle -->
    <g class="robot-antenna">
      <line x1="50" y1="34" x2="50" y2="16"
            stroke="var(--chat-accent-line)"
            stroke-width="2"
            stroke-linecap="round" />
      <circle class="robot-antenna-tip" cx="50" cy="14" r="4" />
    </g>

    <!-- Head — bobs and wiggles as a unit -->
    <g class="robot-head">

      <!-- Side ports — small visual detail that reads as "ears" -->
      <rect x="14" y="50" width="6" height="16" rx="3" fill="var(--chat-border-light)" />
      <rect x="80" y="50" width="6" height="16" rx="3" fill="var(--chat-border-light)" />

      <!-- Head shell -->
      <rect class="robot-face" x="20" y="30" width="60" height="52" rx="20" />

      <!-- Inner face plate — a darker inset that frames the eyes and mouth -->
      <rect x="27" y="40" width="46" height="34" rx="14"
            fill="#07111f" opacity="0.7" />

      <!-- Eyes — blink independently of the head's motion -->
      <circle class="robot-eye-left"  cx="39" cy="53" r="5" />
      <circle class="robot-eye-right" cx="61" cy="53" r="5" />

      <!-- Mouth — a small cyan bar -->
      <rect class="robot-mouth" x="43" y="66" width="14" height="2.5" rx="1.25" />

    </g>

    <!-- Hand — offscreen by default; the wave animation brings it in -->
    <g class="robot-hand" transform="translate(84 68)">
      <circle cx="0" cy="0" r="5" fill="var(--chat-accent)" opacity="0.9" />
      <rect x="-3" y="5" width="6" height="8" rx="2"
            fill="var(--chat-accent)" opacity="0.7" />
    </g>

  </svg>
</button>
