<div
  class="chat-message-list"
  #scrollContainer
  (scroll)="onScroll()">

  @if (messages().length === 0 && !isThinking()) {
    <div class="chat-empty-state">
      <svg class="robot-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g class="robot-head">
          <rect class="robot-face" x="20" y="30" width="60" height="52" rx="20" />
          <circle class="robot-eye-left"  cx="39" cy="53" r="5" />
          <circle class="robot-eye-right" cx="61" cy="53" r="5" />
          <rect class="robot-mouth" x="43" y="66" width="14" height="2.5" rx="1.25" />
        </g>
      </svg>

      <b>How can I help?</b>
      Ask me anything about the EI console. Try one of these to start:

      <div class="chat-empty-state-hints">
        @for (hint of hintPrompts; track hint) {
          <div
            class="chat-empty-state-hint"
            (click)="onHintClick(hint)">{{ hint }}</div>
        }
      </div>
    </div>
  }

  @for (m of messages(); track m.id) {
    <ei-chat-message [message]="m" />
  }

  @if (isThinking()) {
    <div class="chat-message assistant">
      <div class="chat-message-avatar" aria-hidden="true">
        <svg class="robot-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <g class="robot-head">
            <rect class="robot-face" x="20" y="30" width="60" height="52" rx="20" />
            <circle class="robot-eye-left"  cx="39" cy="53" r="5" />
            <circle class="robot-eye-right" cx="61" cy="53" r="5" />
            <rect class="robot-mouth" x="43" y="66" width="14" height="2.5" rx="1.25" />
          </g>
        </svg>
      </div>
      <div class="chat-message-content">
        <div class="chat-thinking">
          <span class="chat-thinking-dot"></span>
          <span class="chat-thinking-dot"></span>
          <span class="chat-thinking-dot"></span>
        </div>
      </div>
    </div>
  }

</div>

@if (showJumpToLatest()) {
  <button
    type="button"
    class="chat-jump-latest"
    (click)="scrollToBottom()">
    ↓ Jump to latest
  </button>
}
